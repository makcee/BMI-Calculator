<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section class="bmi">
        <h2>Body Mass Index Calculator</h2>
        <div>
            <p class="p-bmi">Height in cm</p>
            <input type="number" name="height" id="height">
            <p class="p-bmi">Weight in kg</p>
            <input type="number" name="weight" id="weight">
            <p id="result"></p>
            <button type="button" onclick="calculateBMI()">Calculate</button>
        </div>
    </section>
    <section class="chart">
        <table>
            <thead>
                <tr>
                    <th>BMI</th>
                    <th>Category</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>less than 18.5</td>
                    <td>Underweight</td>
                </tr>
                <tr>
                    <td>between 18.5 and 24.9</td>
                    <td>Ideal</td>
                </tr>
                <tr>
                    <td>between 25 and 29.9</td>
                    <td>Overweight</td>
                </tr>
                <tr>
                    <td>over 30</td>
                    <td>Obesity</td>
                </tr>
            </tbody>
        </table>
    </section>

</body>

</html>
